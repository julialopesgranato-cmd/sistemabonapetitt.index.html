<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bon Apetitt — Cardápio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --char: #121110;
    --char-2: #1D1B18;
    --paper: #FFFBEF;
    --paper-2: #F4E9C9;
    --yellow: #FFC629;
    --yellow-deep: #C98F00;
    --ink: #0E0D0B;
    --danger: #C1442E;
    --pickle: #4C8C4A;
    --line: rgba(255,255,255,.10);
  }
  *{box-sizing:border-box;}
  body{margin:0;padding:0;}
  #root{
    font-family:'DM Sans', sans-serif;
    background:var(--char);
    color:var(--paper);
    min-height:100vh;
  }
  .display{font-family:'Anton', sans-serif; letter-spacing:.02em; text-transform:uppercase;}

  .topbar{
    position:sticky; top:0; z-index:20;
    background:var(--ink); border-bottom:3px solid var(--yellow);
    padding:14px 20px;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{
    width:40px; height:40px; border-radius:50%;
    background:var(--yellow); border:2px solid var(--ink);
    display:flex; align-items:center; justify-content:center;
    font-family:'Anton',sans-serif; font-size:17px; color:var(--ink);
    flex-shrink:0; overflow:hidden;
  }
  .brand-mark img{width:100%;height:100%;object-fit:cover;}
  .brand-text .display{font-size:22px; line-height:1; color:var(--yellow);}
  .brand-text small{display:block; font-size:10px; letter-spacing:.15em; color:var(--paper-2); text-transform:uppercase; margin-top:2px;}
  .nav-toggle{
    background:transparent; border:1.5px solid var(--paper-2); color:var(--paper-2);
    border-radius:999px; padding:8px 16px; font-size:12px; letter-spacing:.05em;
    cursor:pointer; font-family:'DM Sans',sans-serif; text-transform:uppercase;
    transition:.15s;
  }
  .nav-toggle:hover{border-color:var(--yellow); color:var(--yellow);}
  .nav-toggle.active{background:var(--yellow); border-color:var(--yellow); color:var(--ink); font-weight:700;}

  .tabs{
    display:flex; gap:8px; overflow-x:auto; padding:14px 20px 0 20px;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex-shrink:0; background:var(--char-2); color:var(--paper-2);
    border:1px solid var(--line);
    padding:8px 16px; border-radius:999px; font-size:13px; cursor:pointer;
    font-family:'DM Sans',sans-serif; white-space:nowrap; transition:.15s;
  }
  .tab.active{background:var(--yellow); color:var(--ink); border-color:var(--yellow); font-weight:700;}

  .layout{
    display:flex; gap:24px; max-width:1180px; margin:0 auto; padding:20px; align-items:flex-start;
  }
  .menu-col{flex:1; min-width:0;}
  .cart-col{
    width:340px; flex-shrink:0; position:sticky; top:96px;
  }
  @media (max-width:880px){
    .layout{flex-direction:column;}
    .cart-col{width:100%; position:static;}
  }

  .cat-heading{
    font-size:26px; margin:6px 0 4px 2px; color:var(--yellow);
  }
  .cat-sub{ font-size:13px; color:var(--paper-2); opacity:.8; margin:0 0 14px 2px; }
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media (max-width:600px){.grid{grid-template-columns:1fr;}}

  .item-card{
    background:var(--paper); color:var(--ink); border-radius:10px; padding:16px;
    display:flex; flex-direction:column; gap:8px; position:relative;
    border:1px solid transparent;
  }
  .item-card.out{opacity:.5;}
  .item-name{font-weight:700; font-size:16px; line-height:1.2;}
  .item-desc{font-size:12.5px; color:#5c5347; line-height:1.4; min-height:32px;}
  .item-row{display:flex; align-items:center; justify-content:space-between; margin-top:auto;}
  .item-price{font-weight:700; color:var(--yellow-deep); font-size:15px;}
  .out-tag{font-size:10px; text-transform:uppercase; letter-spacing:.08em; background:var(--ink); color:var(--paper); padding:3px 8px; border-radius:4px;}

  .stepper{display:flex; align-items:center; gap:8px;}
  .stepper button{
    width:26px; height:26px; border-radius:50%; border:none; cursor:pointer;
    background:var(--ink); color:var(--yellow); font-size:15px; line-height:1; font-weight:700;
  }
  .stepper button:disabled{opacity:.3; cursor:default;}
  .stepper span{min-width:16px; text-align:center; font-weight:700;}
  .add-btn{
    background:var(--yellow); color:var(--ink); border:none; border-radius:6px;
    padding:7px 14px; font-size:12.5px; font-weight:700; cursor:pointer; text-transform:uppercase; letter-spacing:.03em;
  }
  .add-btn:hover{filter:brightness(1.06);}

  .builder-card{
    background:var(--paper); color:var(--ink); border-radius:12px; padding:22px;
  }
  .builder-desc{font-size:13px; color:#5c5347; margin-bottom:18px;}
  .step-label{
    font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
    color:var(--yellow-deep); margin:18px 0 10px 0; display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  }
  .step-label .num{
    width:20px; height:20px; border-radius:50%; background:var(--ink); color:var(--yellow);
    display:inline-flex; align-items:center; justify-content:center; font-size:11px; font-family:'Anton',sans-serif;
  }
  .step-hint{font-size:11px; color:#8a8070; font-weight:400; text-transform:none; letter-spacing:0;}
  .pill-grid{display:flex; flex-wrap:wrap; gap:8px;}
  .option-pill{
    border:1.5px solid #d9cba0; background:#fffdf5; color:var(--ink);
    border-radius:999px; padding:8px 14px; font-size:13px; cursor:pointer; transition:.15s;
    display:flex; align-items:center; gap:6px;
  }
  .option-pill:hover{border-color:var(--yellow-deep);}
  .option-pill.selected{background:var(--ink); border-color:var(--ink); color:var(--yellow); font-weight:700;}
  .option-pill .extra{font-size:11px; opacity:.8;}
  .selado-row{display:flex; gap:8px; margin-top:10px;}
  .builder-summary{
    margin-top:20px; padding-top:16px; border-top:1px dashed #c9bb8e;
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
  }
  .builder-price{font-size:18px; font-weight:700; color:var(--yellow-deep);}
  .builder-warn{font-size:12px; color:var(--danger); margin-top:8px; min-height:16px;}
  .builder-note{font-size:12px; color:#8a7c50; margin-top:2px;}

  .ticket{
    background:var(--paper); color:var(--ink); border-radius:4px;
    padding:20px 18px 16px 18px;
    position:relative;
    clip-path:polygon(
      0% 8px,4% 0%,8% 8px,12% 0%,16% 8px,20% 0%,24% 8px,28% 0%,32% 8px,36% 0%,40% 8px,44% 0%,48% 8px,52% 0%,56% 8px,60% 0%,64% 8px,68% 0%,72% 8px,76% 0%,80% 8px,84% 0%,88% 8px,92% 0%,96% 8px,100% 0%,
      100% calc(100% - 8px),96% 100%,92% calc(100% - 8px),88% 100%,84% calc(100% - 8px),80% 100%,76% calc(100% - 8px),72% 100%,68% calc(100% - 8px),64% 100%,60% calc(100% - 8px),56% 100%,52% calc(100% - 8px),48% 100%,44% calc(100% - 8px),40% 100%,36% calc(100% - 8px),32% 100%,28% calc(100% - 8px),24% 100%,20% calc(100% - 8px),16% 100%,12% calc(100% - 8px),8% 100%,4% calc(100% - 8px),0% 100%
    );
  }
  .ticket-title{font-size:20px; text-align:center; margin-bottom:2px;}
  .ticket-sub{text-align:center; font-size:10.5px; letter-spacing:.15em; text-transform:uppercase; color:#7a7060; margin-bottom:14px;}
  .ticket-line{border-top:1px dashed #c9bb8e; margin:10px 0;}
  .ticket-empty{font-size:13px; color:#7a7060; text-align:center; padding:20px 0;}
  .ticket-item{display:flex; justify-content:space-between; align-items:flex-start; font-size:13.5px; margin-bottom:8px; gap:8px;}
  .ticket-item-name{font-weight:700;}
  .ticket-item-qty{color:#7a7060; font-size:12px;}
  .ticket-item-meta{color:#7a7060; font-size:11.5px; line-height:1.4; margin-top:2px; max-width:190px;}
  .ticket-item-remove{background:none;border:none;color:var(--danger);cursor:pointer;font-size:16px;line-height:1;padding:0 2px;}
  .ticket-total-row{display:flex; justify-content:space-between; font-size:16px; font-weight:700; margin-top:12px;}
  .ticket input, .ticket textarea{
    width:100%; padding:9px 10px; border-radius:5px; border:1px solid #d9cba0;
    font-family:'DM Sans',sans-serif; font-size:13px; margin-top:6px; background:#fffdf5; resize:vertical;
  }
  .ticket label{font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:#7a7060; margin-top:12px; display:block;}
  .order-type-row{display:flex; gap:6px; margin-top:8px;}
  .order-type-btn{
    flex:1; text-align:center; border:1.5px solid #d9cba0; background:#fffdf5; color:var(--ink);
    padding:8px 4px; border-radius:6px; font-size:11.5px; cursor:pointer; font-weight:600;
  }
  .order-type-btn.selected{background:var(--ink); border-color:var(--ink); color:var(--yellow);}
  .send-btn{
    width:100%; margin-top:16px; background:var(--yellow); color:var(--ink); border:none;
    padding:13px; border-radius:6px; font-family:'Anton',sans-serif; letter-spacing:.03em;
    font-size:16px; cursor:pointer; text-transform:uppercase;
  }
  .send-btn:hover{filter:brightness(1.05);}
  .send-btn:disabled{opacity:.4; cursor:default;}
  .confirm-box{
    background:var(--pickle); color:#fff; padding:14px; border-radius:6px; font-size:13.5px; text-align:center; margin-top:14px;
  }

  .pix-box{
    margin-top:10px; border-radius:10px; padding:14px;
    background:linear-gradient(135deg, #d6f5f0, #eafaf7);
    border:1.5px solid #32BCAD;
    position:relative; overflow:hidden;
  }
  .pix-box-head{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .pix-badge{
    background:#32BCAD; color:#fff; font-family:'Anton',sans-serif; font-size:12px; letter-spacing:.05em;
    padding:4px 9px; border-radius:5px;
  }
  .pix-box-title{ font-size:13.5px; font-weight:700; color:#0d5a52; }
  .pix-key-row{
    display:flex; align-items:center; gap:8px; background:#fff; border:1px dashed #32BCAD;
    border-radius:8px; padding:9px 10px;
  }
  .pix-key-text{
    flex:1; font-family:'Courier New', monospace; font-size:13px; color:var(--ink);
    word-break:break-all; line-height:1.3;
  }
  .pix-copy-btn{
    flex-shrink:0; background:#32BCAD; color:#fff; border:none; border-radius:6px;
    padding:8px 12px; font-size:11.5px; font-weight:700; cursor:pointer; text-transform:uppercase; letter-spacing:.03em;
    transition:.15s;
  }
  .pix-copy-btn:hover{ filter:brightness(1.08); }
  .pix-copy-btn.copied{ background:var(--pickle); }
  .pix-hint{ font-size:11px; color:#0d5a52; margin-top:8px; line-height:1.4; }

  .admin-wrap{max-width:820px; margin:0 auto; padding:30px 20px 60px;}
  .pin-box{
    max-width:320px; margin:60px auto; background:var(--char-2); border:1px solid var(--line);
    border-radius:10px; padding:28px; text-align:center;
  }
  .pin-box input{
    width:100%; text-align:center; letter-spacing:.4em; font-size:20px; padding:12px;
    border-radius:6px; border:1px solid #444; background:var(--char); color:var(--paper); margin:14px 0;
    font-family:'DM Sans',sans-serif;
  }
  .pin-box button{
    background:var(--yellow); color:var(--ink); border:none; padding:10px 22px; border-radius:6px;
    font-weight:700; cursor:pointer; text-transform:uppercase; font-size:12.5px; letter-spacing:.05em;
  }
  .pin-error{color:var(--danger); font-size:12px; margin-top:8px; min-height:16px;}

  .admin-section{margin-bottom:36px;}
  .admin-h{font-size:20px; margin-bottom:14px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; color:var(--yellow);}
  .admin-item{
    background:var(--char-2); border:1px solid var(--line); border-radius:8px; padding:14px; margin-bottom:10px;
    display:grid; grid-template-columns:1fr 1fr; gap:8px;
  }
  .admin-item input, .admin-item select, .admin-item textarea{
    background:var(--char); border:1px solid #453b2e; color:var(--paper); border-radius:5px; padding:7px 9px; font-size:13px;
    font-family:'DM Sans',sans-serif; width:100%;
  }
  .admin-item .full{grid-column:1 / -1;}
  .admin-item-actions{grid-column:1/-1; display:flex; gap:8px; margin-top:4px;}
  .mini-btn{
    border:none; border-radius:5px; padding:7px 12px; font-size:11.5px; cursor:pointer; font-weight:700;
    text-transform:uppercase; letter-spacing:.03em;
  }
  .mini-btn.danger{background:var(--danger); color:#fff;}
  .mini-btn.neutral{background:#453b2e; color:var(--paper);}
  .mini-btn.good{background:var(--pickle); color:#fff;}
  .add-item-btn{
    width:100%; padding:12px; border-radius:8px; border:1.5px dashed #6b5f4a; background:transparent;
    color:var(--paper-2); cursor:pointer; font-size:13px; margin-top:6px;
  }
  .order-card{
    background:var(--char-2); border:1px solid var(--line); border-radius:8px; padding:14px; margin-bottom:10px;
  }
  .order-card.done{opacity:.5;}
  .order-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .order-who{font-weight:700; font-size:14px;}
  .order-time{font-size:11px; color:#a99f8c;}
  .order-items{font-size:13px; color:var(--paper-2); line-height:1.6;}
  .order-delivery{font-size:12px; color:var(--yellow); margin-top:6px;}
  .order-total{font-weight:700; margin-top:8px; color:var(--yellow);}
  .status-pill{font-size:10.5px; padding:3px 10px; border-radius:999px; text-transform:uppercase; letter-spacing:.05em; font-weight:700;}
  .status-pill.pendente{background:var(--yellow); color:var(--ink);}
  .status-pill.pronto{background:var(--pickle); color:#fff;}
  .save-bar{
    position:sticky; bottom:0; background:var(--char); padding:14px 0; border-top:2px solid var(--yellow);
    display:flex; justify-content:flex-end; gap:10px; margin-top:10px;
  }
  .empty-note{color:#a99f8c; font-size:13px; text-align:center; padding:30px 0;}

  .kitchen-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:760px){ .kitchen-grid{ grid-template-columns:1fr; } }
  .kitchen-card{
    background:var(--char-2); border:2px solid var(--yellow); border-radius:10px; padding:16px;
  }
  .kitchen-card.done{ border-color:var(--line); opacity:.6; }
  .kitchen-card-top{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px; }
  .kitchen-who{ font-size:16px; font-weight:700; }
  .kitchen-tag{ font-size:10.5px; background:var(--yellow); color:var(--ink); padding:2px 8px; border-radius:999px; margin-left:6px; font-weight:700; }
  .kitchen-btn{ flex:1; padding:12px; font-size:13px; }

  .share-box{ display:flex; gap:20px; flex-wrap:wrap; align-items:flex-start; }
  .share-qr-col{ flex-shrink:0; }
  .qr-code-box{ background:#fff; padding:10px; border-radius:10px; width:170px; height:170px; display:flex; align-items:center; justify-content:center; }
  .share-link-col{ flex:1; min-width:240px; }
  .pin-change{display:flex; gap:8px; align-items:center; margin-top:8px;}
  .pin-change input{width:120px;}

  .builder-admin-group{margin-bottom:22px;}
  .builder-admin-group h4{font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--yellow); margin:0 0 8px 0;}
  .opt-row{display:flex; gap:8px; margin-bottom:6px; align-items:center;}
  .opt-row input[type=text]{flex:1;}
  .opt-row input[type=number]{width:90px;}
  .opt-row button{flex-shrink:0;}
  .base-row{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px;}
  .base-row > div{flex:1; min-width:160px;}
  .base-row label{font-size:10px; color:#a99f8c; text-transform:uppercase; letter-spacing:.05em; display:block; margin-bottom:4px;}
  .logo-row{display:flex; align-items:center; gap:14px; margin-bottom:16px;}
  .logo-preview{width:56px;height:56px;border-radius:50%;background:var(--yellow);overflow:hidden;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:2px solid var(--char);}
  .logo-preview img{width:100%;height:100%;object-fit:cover;}
</style>
</head>

<div id="root"></div>

async function loadAll(){
  try{
    const m = await window.storage.get("menu-items", true);
    state.menu = m ? JSON.parse(m.value) : DEFAULT_MENU;
  }catch(e){ state.menu = DEFAULT_MENU; }
  try{
    const b = await window.storage.get("builder-config", true);
    state.builder = b ? JSON.parse(b.value) : DEFAULT_BUILDER;
    if(state.builder.secondProteinPrice===undefined) state.builder.secondProteinPrice = DEFAULT_BUILDER.secondProteinPrice;
  }catch(e){ state.builder = DEFAULT_BUILDER; }
  try{
    const p = await window.storage.get("pasta-config", true);
    state.pasta = p ? JSON.parse(p.value) : DEFAULT_PASTA;
  }catch(e){ state.pasta = DEFAULT_PASTA; }
  try{
    const r = await window.storage.get("ready-config", true);
    state.ready = r ? JSON.parse(r.value) : DEFAULT_READY;
  }catch(e){ state.ready = DEFAULT_READY; }
  try{
    const o = await window.storage.get("orders-list", true);
    state.orders = o ? JSON.parse(o.value) : [];
  }catch(e){ state.orders = []; }
  try{
    const s = await window.storage.get("settings", true);
    state.settings = s ? JSON.parse(s.value) : DEFAULT_SETTINGS;
  }catch(e){ state.settings = DEFAULT_SETTINGS; }
  state.loading = false;
  render();
}

async function saveMenu(newMenu){
  state.menu = newMenu;
  try{ await window.storage.set("menu-items", JSON.stringify(newMenu), true); }catch(e){ console.error(e); }
  render();
}

}

async function saveOrders(newOrders){

}
async function getLatestOrders(){
  try{
    const o = await window.storage.get("orders-list", true);
    return o ? JSON.parse(o.value) : [];
  }catch(e){ return state.orders; }
}
async function updateOrderStatus(orderId, newStatus){
  const latest = await getLatestOrders();
  const updated = latest.map(o=> o.id===orderId ? {...o, status:newStatus} : o);
  await saveOrders(updated);
}
async function deleteOrder(orderId){
  const latest = await getLatestOrders();
  const updated = latest.filter(o=> o.id!==orderId);
  await saveOrders(updated);
}
async function saveSettings(newSettings){
  state.settings = newSettings;
  try{ await window.storage.set("settings", JSON.stringify(newSettings), true); }catch(e){ console.error(e); }
  render();
}

    return p ? p.value : DEFAULT_PIN;

}

}

function money(v){ return "R$ " + (v||0).toFixed(2).replace(".", ","); }

function cartTotal(){
  let t = 0;
  for(const id in state.cart){
    const item = state.menu.find(m=>m.id===id);
    if(item) t += item.price * state.cart[id];
  }
  return t;
}
function customCartTotal(){
  return state.customCart.reduce((sum,c)=> sum + c.price*c.qty, 0);
}
function grandTotal(){ return cartTotal() + customCartTotal(); }
function deliveryFeeNow(){ return state.orderType==="entrega" ? (state.settings.deliveryFee||0) : 0; }
function finalTotal(){ return grandTotal() + deliveryFeeNow(); }
function cartCount(){
  return Object.values(state.cart).reduce((a,b)=>a+b,0) + state.customCart.reduce((a,c)=>a+c.qty,0);
}

function setQty(id, delta){
  const cur = state.cart[id] || 0;
  const next = Math.max(0, cur+delta);
  if(next===0) delete state.cart[id];
  else state.cart[id] = next;
  render();
}

/* ---------- BURGER BUILDER ---------- */
function builderPrice(){
  const b = state.builder;
  let total = b.basePrice||0;
  const bread = b.breads.find(x=>x.id===state.builderSel.breadId);
  if(bread) total += bread.extra||0;
  const prot = b.proteins.find(x=>x.id===state.builderSel.proteinId);
  if(prot) total += prot.extra||0;
  if(state.builderSel.secondProteinId) total += b.secondProteinPrice||0;
  state.builderSel.cheeseIds.forEach(cid=>{
    const cheese = b.cheeses.find(x=>x.id===cid);
    if(cheese) total += cheese.extra||0;
  });
  state.builderSel.extras.forEach(exId=>{
    const ex = b.extras.find(x=>x.id===exId);
    if(ex) total += ex.price||0;
  });
  return total;
}

function addBuilderToCart(){
  const sel = state.builderSel;
  if(!sel.breadId || !sel.proteinId || sel.cheeseIds.length===0){
    state.builderWarn = "Escolha pão, proteína e ao menos um queijo antes de adicionar.";
    render();
    return;
  }
  const b = state.builder;
  const bread = b.breads.find(x=>x.id===sel.breadId);
  const prot = b.proteins.find(x=>x.id===sel.proteinId);
  const secondProt = sel.secondProteinId ? b.proteins.find(x=>x.id===sel.secondProteinId) : null;
  const cheeseNames = sel.cheeseIds.map(id=>{
    const c = b.cheeses.find(x=>x.id===id);
    return c ? c.name : null;
  }).filter(Boolean);
  const extraNames = sel.extras.map(id=>{
    const ex = b.extras.find(x=>x.id===id);
    return ex ? ex.name : null;
  }).filter(Boolean);

  const metaParts = [
    "Pão: "+bread.name,
    "Selado: "+(sel.selado===true?"Sim":"Não"),
    "Proteína: "+prot.name + (secondProt ? " + "+secondProt.name+" (2ª carne, +"+money(b.secondProteinPrice)+")" : ""),
    "Queijo(s): "+cheeseNames.join(", "),
  ];
  if(extraNames.length) metaParts.push("Adicionais: "+extraNames.join(", "));

  state.customCart.push({
    lineId:"custom-"+Date.now()+"-"+Math.floor(Math.random()*1000),
    label:"Monte seu Lanche",
    meta: metaParts.join(" · "),
    price: builderPrice(),
    qty:1
  });

  state.builderSel = {breadId:null, selado:null, proteinId:null, secondProteinId:null, cheeseIds:[], extras:[]};
  state.builderWarn = "";
  render();
}

/* ---------- PASTA BUILDER ---------- */
function pastaPrice(){
  const p = state.pasta;
  let total = p.basePrice||0;
  const massa = p.massas.find(x=>x.id===state.pastaSel.massaId);
  if(massa) total += massa.extra||0;
  state.pastaSel.molhoIds.forEach(id=>{
    const m = p.molhos.find(x=>x.id===id);
    if(m) total += m.price||0;
  });
  state.pastaSel.complementoIds.forEach(id=>{
    const c = p.complementos.find(x=>x.id===id);
    if(c) total += c.price||0;
  });
  state.pastaSel.finalIds.forEach(id=>{
    const f = p.finalizacao.find(x=>x.id===id);
    if(f) total += f.price||0;
  });
  return total;
}

function addPastaToCart(){
  const sel = state.pastaSel;
  if(!sel.massaId || sel.molhoIds.length===0){
    state.pastaWarn = "Escolha a massa e ao menos um molho antes de adicionar.";
    render();
    return;
  }
  const p = state.pasta;
  const massa = p.massas.find(x=>x.id===sel.massaId);
  const molhoNames = sel.molhoIds.map(id=>{ const m=p.molhos.find(x=>x.id===id); return m?m.name:null; }).filter(Boolean);
  const compNames = sel.complementoIds.map(id=>{ const c=p.complementos.find(x=>x.id===id); return c?c.name:null; }).filter(Boolean);
  const finalNames = sel.finalIds.map(id=>{ const f=p.finalizacao.find(x=>x.id===id); return f?f.name:null; }).filter(Boolean);

  const metaParts = [
    "Massa: "+massa.name,
    "Alho e cebola: "+(sel.alhoCebola===true?"Sim":"Não"),
    "Molho: "+molhoNames.join(" e "),
  ];
  if(compNames.length) metaParts.push("Complementos: "+compNames.join(", "));
  if(finalNames.length) metaParts.push("Finalização: "+finalNames.join(", "));

  state.customCart.push({
    lineId:"pasta-"+Date.now()+"-"+Math.floor(Math.random()*1000),
    label:"Festival de Massas",
    meta: metaParts.join(" · "),
    price: pastaPrice(),
    qty:1
  });

  state.pastaSel = {massaId:null, alhoCebola:null, molhoIds:[], complementoIds:[], finalIds:[]};

}

/* ---------- READY-MADE BURGERS ---------- */
function getReadySel(itemId){
  if(!state.readySel[itemId]) state.readySel[itemId] = {extraProteinId:null, extraIds:[]};
  return state.readySel[itemId];
}
function readyItemPrice(item){
  const sel = getReadySel(item.id);
  let total = item.price||0;
  if(sel.extraProteinId) total += state.builder.secondProteinPrice||0;
  sel.extraIds.forEach(id=>{
    const ex = state.builder.extras.find(x=>x.id===id);
    if(ex) total += ex.price||0;
  });
  return total;
}
function addReadyToCart(item){
  const sel = getReadySel(item.id);
  const metaParts = [];
  if(sel.extraProteinId){
    const prot = state.builder.proteins.find(x=>x.id===sel.extraProteinId);
    if(prot) metaParts.push("Carne extra: "+prot.name+" (+"+money(state.builder.secondProteinPrice)+")");
  }
  if(sel.extraIds.length){
    const names = sel.extraIds.map(id=>{ const ex=state.builder.extras.find(x=>x.id===id); return ex?ex.name:null; }).filter(Boolean);
    metaParts.push("Adicionais: "+names.join(", "));
  }
  state.customCart.push({
    lineId:"ready-"+Date.now()+"-"+Math.floor(Math.random()*1000),
    label:item.name,
    meta: metaParts.length ? metaParts.join(" · ") : "Sem adicionais",
    price: readyItemPrice(item),
    qty:1
  });
  state.readySel[item.id] = {extraProteinId:null, extraIds:[]};
  state.readyExpanded = null;
  render();
}

/* ---------- ORDER / WHATSAPP ---------- */
function otLabelText(ot){ return ot==="mesa" ? "Mesa" : ot==="entrega" ? "Entrega" : "Retirada"; }

function paymentLabelText(order){
  if(order.paymentMethod==="cartao") return "Cartão";
  if(order.paymentMethod==="pix") return "Pix";
  if(order.paymentMethod==="dinheiro"){
    if(order.needsChange) return "Dinheiro (troco para " + money(order.changeFor) + ")";
    return "Dinheiro (sem troco)";
  }
  return "Não informado";
}

function buildWhatsAppMessage(order){
  let lines = [];
  lines.push("*Novo pedido - Bon Apetitt*");
  lines.push("Cliente: " + order.customer);
  lines.push("Tipo: " + otLabelText(order.orderType));
  if(order.orderType==="mesa") lines.push("Mesa: " + order.table);
  if(order.orderType==="entrega"){
    lines.push("Endereço: " + (order.address || "-"));
    if(order.reference) lines.push("Referência: " + order.reference);
  }
  lines.push("");
  lines.push("*Itens:*");
  order.items.forEach(it=>{ lines.push("- " + it.qty + "x " + it.name + " (" + money(it.price*it.qty) + ")"); });
  lines.push("");
  lines.push("*Total: " + money(order.total) + "*");
  lines.push("Pagamento: " + paymentLabelText(order));
  if(order.paymentMethod==="pix" && state.settings.pixKey) lines.push("Chave Pix: " + state.settings.pixKey);
  if(order.orderType==="entrega") lines.push("Tempo estimado: " + state.settings.etaMin + " a " + state.settings.etaMax + " minutos");
  return lines.join("\n");
}

async function submitOrder(){
  if(cartCount()===0) return;
  if(!state.paymentMethod) return;
  if(state.paymentMethod==="dinheiro" && state.needsChange===null) return;
  const simpleItems = Object.entries(state.cart).map(([id,qty])=>{
    const m = state.menu.find(x=>x.id===id);
    return {name:m.name, qty, price:m.price};
  });
  const customItems = state.customCart.map(c=>({ name: c.label + " (" + c.meta + ")", qty: c.qty, price: c.price }));
  const items = [...simpleItems, ...customItems];
  if(state.orderType==="entrega" && state.settings.deliveryFee>0){
    items.push({name:"Taxa de entrega", qty:1, price:state.settings.deliveryFee});
  }
  const order = {
    id: "ord-"+Date.now()+"-"+Math.floor(Math.random()*1000),
    ts: Date.now(),
    customer: state.customer || "Cliente",
    orderType: state.orderType,
    table: state.table || "-",
    address: state.address || "",
    reference: state.reference || "",
    paymentMethod: state.paymentMethod,
    needsChange: state.needsChange,
    changeFor: state.changeFor ? parseFloat(state.changeFor)||0 : 0,
    items: items,
    total: finalTotal(),
    status:"pendente"
  };
  // Busca a lista mais atual de pedidos bem na hora de salvar, para não
  // sobrescrever pedidos que outros clientes tenham enviado nesse meio-tempo.
  let latestOrders = state.orders;
  try{
    const o = await window.storage.get("orders-list", true);
    latestOrders = o ? JSON.parse(o.value) : [];
  }catch(e){}
  const updated = [order, ...latestOrders];
  await saveOrders(updated);
  state.cart = {};
  state.customCart = [];
  state.paymentMethod = null;
  state.needsChange = null;
  state.changeFor = "";
  state.sent = true;
  state.whatsappSent = false;
  state.lastOrder = order;
  render();
}

function printOrderReceipt(order){
  const old = document.getElementById("print-frame");
  if(old) old.remove();

  const iframe = document.createElement("iframe");
  iframe.id = "print-frame";
  iframe.style.position = "fixed";
  iframe.style.right = "0";
  iframe.style.bottom = "0";
  iframe.style.width = "0";
  iframe.style.height = "0";
  iframe.style.border = "0";
  document.body.appendChild(iframe);

  const doc = iframe.contentWindow.document;
  doc.open();
  doc.write(buildReceiptHTML(order));
  doc.close();

  let printed = false;
  const doPrint = ()=>{
    if(printed) return;
    printed = true;
    try{
      iframe.contentWindow.focus();
      iframe.contentWindow.print();
    }catch(e){
      openPrintFallbackTab(order);
    }
  };

  iframe.onload = ()=> setTimeout(doPrint, 250);
  // Segurança: em alguns navegadores/celulares o onload do iframe não dispara.
  setTimeout(doPrint, 900);
}

function openPrintFallbackTab(order){
  const w = window.open("", "_blank");
  if(w){
    w.document.open();
    w.document.write(buildReceiptHTML(order));
    w.document.close();
    setTimeout(()=>{ try{ w.focus(); w.print(); }catch(e){} }, 300);
  } else {
    alert("Seu navegador bloqueou a impressão automática. Permita pop-ups para este site e tente de novo, ou use o botão de compartilhar/imprimir do próprio navegador.");
  }
}

function playNewOrderBeep(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.18].forEach(delay=>{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.15, ctx.currentTime + delay);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + 0.15);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(ctx.currentTime + delay);
      osc.stop(ctx.currentTime + delay + 0.16);
    });
  }catch(e){}
}

async function refreshOrdersSilently(){
  try{
    const o = await window.storage.get("orders-list", true);
    const fresh = o ? JSON.parse(o.value) : [];
    const pendingCount = fresh.filter(x=>x.status==="pendente").length;
    if(pendingCount > lastPendingCount) playNewOrderBeep();
    lastPendingCount = pendingCount;
    state.orders = fresh;
    if(state.view === "kitchen"){
      const root = document.getElementById("root");
      root.innerHTML = renderTopbar() + renderKitchenView();
      attachEvents();
    }
  }catch(e){}
}

function manageKitchenPolling(){
  if(state.view === "kitchen" && state.adminUnlocked){
    if(!kitchenTimer){
      lastPendingCount = state.orders.filter(x=>x.status==="pendente").length;
      kitchenTimer = setInterval(refreshOrdersSilently, 8000);
    }
  } else {
    if(kitchenTimer){ clearInterval(kitchenTimer); kitchenTimer = null; }
  }
}

function renderKitchenView(){

        </div>

      <div class="builder-note" style="margin-bottom:10px;">Carne extra usa o mesmo valor configurado em "Monte seu Lanche" (${money(b.secondProteinPrice)}). Os adicionais abaixo usam os mesmos itens e preços da lista de acréscimos do Monte seu Lanche — marque quais fazem sentido oferecer aqui.</div>
      <div class="builder-admin-group">
        <h4>Adicionais disponíveis para os Lanches Prontos</h4>
        <div class="pill-grid" style="margin-bottom:10px;">
          ${b.extras.map(x=>`<div class="option-pill ${state.ready.extraIds.includes(x.id)?'selected':''}" data-r-extra-toggle="${x.id}">${escapeHtml(x.name)} <span class="extra">+${money(x.price)}</span></div>`).join("")}
        </div>
      </div>
      <div class="builder-admin-group">
        <h4>Itens</h4>
        ${state.ready.items.map((item,idx)=>`
          <div class="admin-item" data-r-idx="${idx}">
            <div><label style="font-size:10px;color:#a99f8c;">Nome</label><input type="text" data-r-field="name" data-idx="${idx}" value="${escapeHtml(item.name)}"></div>
            <div><label style="font-size:10px;color:#a99f8c;">Preço (R$)</label><input type="number" step="0.10" min="0" data-r-field="price" data-idx="${idx}" value="${item.price}"></div>
            <div class="full"><label style="font-size:10px;color:#a99f8c;">Descrição</label><input type="text" data-r-field="desc" data-idx="${idx}" value="${escapeHtml(item.desc||"")}"></div>
            <div><label style="font-size:10px;color:#a99f8c;">Disponibilidade</label>
              <select data-r-field="active" data-idx="${idx}">
                <option value="true" ${item.active?'selected':''}>Disponível</option>
                <option value="false" ${!item.active?'selected':''}>Esgotado</option>
              </select>
            </div>
            <div class="admin-item-actions"><button class="mini-btn danger" data-r-del-item="${idx}">Remover item</button></div>
          </div>`).join("")}
        <button class="add-item-btn" id="btn-add-ready-item">+ Adicionar lanche pronto</button>
      </div>
      <div class="save-bar"><button class="mini-btn good" id="btn-save-ready">${state.savingReady?'Salvando…':'Salvar Lanches Prontos'}</button></div>
    </div>

    <div class="admin-section">
      <div class="admin-h"><span class="display" style="font-size:20px;">Festival de Massas — personalização</span></div>
      <div class="base-row">
        <div><label>Ativo no cardápio</label><select id="p-active"><option value="true" ${p.active?'selected':''}>Sim</option><option value="false" ${!p.active?'selected':''}>Não</option></select></div>
        <div><label>Preço base do prato (R$)</label><input type="number" step="0.10" min="0" id="p-baseprice" value="${p.basePrice}"></div>
        <div><label>Máx. de complementos</label><input type="number" step="1" min="1" id="p-maxcomp" value="${p.maxComplementos||5}"></div>
        <div style="flex:2 1 260px;"><label>Descrição (aparece no topo)</label><input type="text" id="p-desc" value="${escapeHtml(p.desc||"")}"></div>
      </div>
      <div class="builder-admin-group"><h4>Massas</h4>${optRows('pasta',p.massas,'massas','Acréscimo','extra')}<button class="add-item-btn" data-b-add="massas" data-obj="pasta">+ Adicionar massa</button></div>
      <div class="builder-admin-group"><h4>Molhos</h4>${optRows('pasta',p.molhos,'molhos','Preço','price')}<button class="add-item-btn" data-b-add="molhos" data-obj="pasta">+ Adicionar molho</button></div>
      <div class="builder-admin-group"><h4>Complementos</h4>${optRows('pasta',p.complementos,'complementos','Preço','price')}<button class="add-item-btn" data-b-add="complementos" data-obj="pasta">+ Adicionar complemento</button></div>
      <div class="builder-admin-group"><h4>Finalização (parmesão / cebolinha)</h4>${optRows('pasta',p.finalizacao,'finalizacao','Preço','price')}<button class="add-item-btn" data-b-add="finalizacao" data-obj="pasta">+ Adicionar item</button></div>
      <div class="save-bar"><button class="mini-btn good" id="btn-save-pasta">${state.savingPasta ? 'Salvando…' : 'Salvar Festival de Massas'}</button></div>
    </div>

    <div class="admin-section">
      <div class="admin-h"><span class="display" style="font-size:20px;">Editar cardápio (Lanches Matinais / Bebidas / Sobremesas)</span></div>
      ${menuItemsHtml}
      <button class="add-item-btn" id="btn-add-item">+ Adicionar novo item</button>
      <div class="save-bar"><button class="mini-btn good" id="btn-save-menu">${state.savingMenu ? 'Salvando…' : 'Salvar alterações do cardápio'}</button></div>
    </div>

    <div class="admin-section">
      <div class="admin-h"><span class="display" style="font-size:18px;">Trocar PIN</span></div>
      <div class="pin-change"><input type="text" id="inp-newpin" placeholder="Novo PIN"><button class="mini-btn neutral" id="btn-savepin">Salvar PIN</button></div>
    </div>
  </div>`;
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, s=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[s]));
}

function attachEvents(){
  const $ = sel => document.getElementById(sel);
  const $$ = sel => document.querySelectorAll(sel);

  const adminBtn = $("btn-admin");
  if(adminBtn) adminBtn.onclick = ()=>{ state.view = state.view==="admin" ? "menu" : "admin"; render(); };
  const kitchenBtn = $("btn-kitchen");
  if(kitchenBtn) kitchenBtn.onclick = ()=>{ state.view = state.view==="kitchen" ? "menu" : "kitchen"; render(); };

  $$("[data-cat]").forEach(el=>{ el.onclick = ()=>{ state.cat = el.dataset.cat; render(); }; });

  $$("[data-add]").forEach(el=> el.onclick = ()=> setQty(el.dataset.add, 1));
  $$("[data-inc]").forEach(el=> el.onclick = ()=> setQty(el.dataset.inc, 1));
  $$("[data-dec]").forEach(el=> el.onclick = ()=> setQty(el.dataset.dec, -1));
  $$("[data-remove]").forEach(el=> el.onclick = ()=>{ delete state.cart[el.dataset.remove]; render(); });
  $$("[data-remove-custom]").forEach(el=> el.onclick = ()=>{ state.customCart = state.customCart.filter(c=>c.lineId!==el.dataset.removeCustom); render(); });

  const custInp = $("inp-customer");
  if(custInp) custInp.oninput = e=>{ state.customer = e.target.value; };
  $$("[data-ordertype]").forEach(el=> el.onclick = ()=>{ state.orderType = el.dataset.ordertype; render(); });
  const tableInp = $("inp-table");
  if(tableInp) tableInp.oninput = e=>{ state.table = e.target.value; };
  const addressInp = $("inp-address");
  if(addressInp) addressInp.oninput = e=>{ state.address = e.target.value; };
  const refInp = $("inp-reference");
  if(refInp) refInp.oninput = e=>{ state.reference = e.target.value; };
  const sendBtn = $("btn-send");
  if(sendBtn) sendBtn.onclick = submitOrder;
  $$("[data-payment]").forEach(el=> el.onclick = ()=>{
    state.paymentMethod = el.dataset.payment;
    if(state.paymentMethod!=="dinheiro"){ state.needsChange=null; state.changeFor=""; }
    state.pixCopied = false;
    render();
  });
  $$("[data-needschange]").forEach(el=> el.onclick = ()=>{
    state.needsChange = el.dataset.needschange === "true";
    if(!state.needsChange) state.changeFor = "";
    render();
  });
  const changeForInp = $("inp-changefor");
  if(changeForInp) changeForInp.oninput = e=>{ state.changeFor = e.target.value; };
  const shareUrlInp = $("s-shareurl");
  if(shareUrlInp) shareUrlInp.onchange = e=>{ state.settings.shareUrl = e.target.value.trim(); };
  const saveShareUrlBtn = $("btn-save-shareurl");
  if(saveShareUrlBtn) saveShareUrlBtn.onclick = async ()=>{ await saveSettings(state.settings); };

  const copyLinkBtn = $("btn-copy-link");
  if(copyLinkBtn) copyLinkBtn.onclick = async ()=>{
    const url = copyLinkBtn.dataset.link || "";
    if(!url) return;
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        await navigator.clipboard.writeText(url);
      } else {
        const ta = document.createElement("textarea");
        ta.value = url;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
      }
      state.linkCopied = true;
      render();
      setTimeout(()=>{ state.linkCopied = false; render(); }, 2500);
    }catch(e){
      alert("Não foi possível copiar automaticamente. Copie manualmente o texto do campo acima.");
    }
  };

  const copyPixBtn = $("btn-copy-pix");
  if(copyPixBtn) copyPixBtn.onclick = async ()=>{
    const key = copyPixBtn.dataset.key;
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        await navigator.clipboard.writeText(key);
      } else {
        const ta = document.createElement("textarea");
        ta.value = key;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
      }
      state.pixCopied = true;
      render();
      setTimeout(()=>{ state.pixCopied = false; render(); }, 2500);
    }catch(e){
      alert("Não foi possível copiar automaticamente. Chave Pix: " + key);
    }
  };
  const waBtn = $("btn-whatsapp");
  if(waBtn) waBtn.onclick = ()=>{ sendLastOrderToWhatsApp(); state.whatsappSent = true; render(); };
  const newOrderBtn = $("btn-new-order");
  if(newOrderBtn) newOrderBtn.onclick = ()=>{
    if(!state.whatsappSent) return;
    state.sent=false; state.lastOrder=null; state.whatsappSent=false; render();
  };

  // burger builder
  $$("[data-bread]").forEach(el=> el.onclick = ()=>{ state.builderSel.breadId = el.dataset.bread; state.builderWarn=""; render(); });
  $$("[data-protein]").forEach(el=> el.onclick = ()=>{
    state.builderSel.proteinId = el.dataset.protein;
    if(state.builderSel.secondProteinId === el.dataset.protein) state.builderSel.secondProteinId = null;
    state.builderWarn=""; render();
  });
  $$("[data-second-protein]").forEach(el=> el.onclick = ()=>{
    const val = el.dataset.secondProtein;
    state.builderSel.secondProteinId = val === "" ? null : val;
    render();
  });
  $$("[data-cheese]").forEach(el=> el.onclick = ()=>{
    const id = el.dataset.cheese;
    const idx = state.builderSel.cheeseIds.indexOf(id);
    if(idx>-1) state.builderSel.cheeseIds.splice(idx,1); else state.builderSel.cheeseIds.push(id);
    state.builderWarn=""; render();
  });
  $$("[data-selado]").forEach(el=> el.onclick = ()=>{ state.builderSel.selado = el.dataset.selado === "true"; render(); });
  $$("[data-extra]").forEach(el=> el.onclick = ()=>{
    const id = el.dataset.extra;
    const idx = state.builderSel.extras.indexOf(id);
    if(idx>-1) state.builderSel.extras.splice(idx,1); else state.builderSel.extras.push(id);
    render();
  });
  const addBuilderBtn = $("btn-add-builder");
  if(addBuilderBtn) addBuilderBtn.onclick = addBuilderToCart;

  // pasta builder
  $$("[data-massa]").forEach(el=> el.onclick = ()=>{ state.pastaSel.massaId = el.dataset.massa; state.pastaWarn=""; render(); });
  $$("[data-alho]").forEach(el=> el.onclick = ()=>{ state.pastaSel.alhoCebola = el.dataset.alho === "true"; render(); });
  $$("[data-molho]").forEach(el=> el.onclick = ()=>{
    const id = el.dataset.molho;
    const idx = state.pastaSel.molhoIds.indexOf(id);
    if(idx>-1) state.pastaSel.molhoIds.splice(idx,1); else state.pastaSel.molhoIds.push(id);
    state.pastaWarn=""; render();
  });
  $$("[data-comp]").forEach(el=> el.onclick = ()=>{
    const id = el.dataset.comp;
    const idx = state.pastaSel.complementoIds.indexOf(id);
    const max = state.pasta.maxComplementos || 5;
    if(idx>-1){ state.pastaSel.complementoIds.splice(idx,1); state.pastaWarn=""; }
    else{
      if(state.pastaSel.complementoIds.length >= max){
        state.pastaWarn = "Máximo de "+max+" complementos por prato.";
        render();
        return;
      }
      state.pastaSel.complementoIds.push(id);
      state.pastaWarn="";
    }
    render();
  });
  $$("[data-final]").forEach(el=> el.onclick = ()=>{
    const id = el.dataset.final;
    const idx = state.pastaSel.finalIds.indexOf(id);
    if(idx>-1) state.pastaSel.finalIds.splice(idx,1); else state.pastaSel.finalIds.push(id);
    render();
  });
  const addPastaBtn = $("btn-add-pasta");
  if(addPastaBtn) addPastaBtn.onclick = addPastaToCart;

  // ready-made burgers
  $$("[data-ready-toggle]").forEach(el=> el.onclick = ()=>{
    const id = el.dataset.readyToggle;
    state.readyExpanded = state.readyExpanded === id ? null : id;
    render();
  });
  $$("[data-ready-protein]").forEach(el=> el.onclick = ()=>{
    const itemId = el.dataset.readyProtein;
    const protId = el.dataset.proteinId;
    const sel = getReadySel(itemId);
    sel.extraProteinId = protId === "" ? null : protId;
    render();
  });
  $$("[data-ready-extra]").forEach(el=> el.onclick = ()=>{
    const itemId = el.dataset.readyExtra;
    const exId = el.dataset.extraId;
    const sel = getReadySel(itemId);
    const idx = sel.extraIds.indexOf(exId);
    if(idx>-1) sel.extraIds.splice(idx,1); else sel.extraIds.push(exId);
    render();
  });
  $$("[data-ready-confirm]").forEach(el=> el.onclick = ()=>{
    const itemId = el.dataset.readyConfirm;
    const item = state.ready.items.find(x=>x.id===itemId);
    if(item) addReadyToCart(item);
  });

  const pinInp = $("inp-pin");
  if(pinInp){ pinInp.oninput = e=>{ state.pinInput = e.target.value; }; pinInp.onkeydown = e=>{ if(e.key==="Enter") tryUnlock(); }; }
  const unlockBtn = $("btn-unlock");
  if(unlockBtn) unlockBtn.onclick = tryUnlock;
  const resetPinBtn = $("btn-reset-pin");
  if(resetPinBtn) resetPinBtn.onclick = async (e)=>{
    e.preventDefault();
    if(confirm("Isso vai redefinir o PIN do admin para o padrão (1234). Deseja continuar?")){
      await setPin(DEFAULT_PIN);
      state.pinError = "PIN redefinido para 1234. Digite-o abaixo para entrar.";
      render();
    }
  };

  const refreshBtn = $("btn-refresh-orders");
  if(refreshBtn) refreshBtn.onclick = async ()=>{
    try{ const o = await window.storage.get("orders-list", true); state.orders = o ? JSON.parse(o.value) : []; }catch(e){}
    render();
  };

  $$("[data-order-done]").forEach(el=> el.onclick = ()=>{ updateOrderStatus(el.dataset.orderDone, "pronto"); });
  $$("[data-order-print]").forEach(el=> el.onclick = ()=>{
    const order = state.orders.find(o=>o.id===el.dataset.orderPrint);
    if(order) printOrderReceipt(order);
  });
  $$("[data-order-pending]").forEach(el=> el.onclick = ()=>{ updateOrderStatus(el.dataset.orderPending, "pendente"); });
  $$("[data-order-del]").forEach(el=> el.onclick = ()=>{ deleteOrder(el.dataset.orderDel); });

  $$("[data-field]").forEach(el=>{
    el.onchange = e=>{
      const idx = parseInt(el.dataset.idx);
      const field = el.dataset.field;
      let val = e.target.value;
      if(field==="price") val = parseFloat(val)||0;
      if(field==="active") val = val==="true";
      state.menu[idx][field] = val;
    };
  });
  $$("[data-del-item]").forEach(el=> el.onclick = ()=>{ state.menu.splice(parseInt(el.dataset.delItem),1); render(); });
  const addItemBtn = $("btn-add-item");
  if(addItemBtn) addItemBtn.onclick = ()=>{ state.menu.push(newBlankItem()); render(); };

  const saveMenuBtn = $("btn-save-menu");
  if(saveMenuBtn) saveMenuBtn.onclick = async ()=>{ state.savingMenu=true; render(); await saveMenu(state.menu); state.savingMenu=false; render(); };

  // settings
  const sLogo = $("s-logo"); if(sLogo) sLogo.onchange = e=>{ state.settings.logoUrl = e.target.value; };
  const sFee = $("s-fee"); if(sFee) sFee.onchange = e=>{ state.settings.deliveryFee = parseFloat(e.target.value)||0; };
  const sEtaMin = $("s-etamin"); if(sEtaMin) sEtaMin.onchange = e=>{ state.settings.etaMin = parseInt(e.target.value)||0; };
  const sEtaMax = $("s-etamax"); if(sEtaMax) sEtaMax.onchange = e=>{ state.settings.etaMax = parseInt(e.target.value)||0; };
  const sWhats = $("s-whats"); if(sWhats) sWhats.onchange = e=>{ state.settings.whatsapp = e.target.value; };
  const sPix = $("s-pix"); if(sPix) sPix.onchange = e=>{ state.settings.pixKey = e.target.value; };
  const saveSettingsBtn = $("btn-save-settings");
  if(saveSettingsBtn) saveSettingsBtn.onclick = async ()=>{ state.savingSettings=true; render(); await saveSettings(state.settings); state.savingSettings=false; render(); };

  // burger admin fields
  const bActive = $("b-active"); if(bActive) bActive.onchange = e=>{ state.builder.active = e.target.value==="true"; };
  const bBase = $("b-baseprice"); if(bBase) bBase.onchange = e=>{ state.builder.basePrice = parseFloat(e.target.value)||0; };
  const bSecond = $("b-secondprotein"); if(bSecond) bSecond.onchange = e=>{ state.builder.secondProteinPrice = parseFloat(e.target.value)||0; };
  const bDesc = $("b-desc"); if(bDesc) bDesc.onchange = e=>{ state.builder.desc = e.target.value; };
  const bulkCheeseBtn = $("btn-bulk-cheese");
  if(bulkCheeseBtn) bulkCheeseBtn.onclick = async ()=>{
    const val = parseFloat($("b-cheese-bulk").value) || 0;
    state.builder.cheeses.forEach(c=> c.extra = val);
    state.savingBuilder = true; render();
    await saveBuilder(state.builder);
    state.savingBuilder = false; render();
  };

  // pasta admin fields
  const pActive = $("p-active"); if(pActive) pActive.onchange = e=>{ state.pasta.active = e.target.value==="true"; };
  const pBase = $("p-baseprice"); if(pBase) pBase.onchange = e=>{ state.pasta.basePrice = parseFloat(e.target.value)||0; };
  const pDesc = $("p-desc"); if(pDesc) pDesc.onchange = e=>{ state.pasta.desc = e.target.value; };
  const pMaxComp = $("p-maxcomp"); if(pMaxComp) pMaxComp.onchange = e=>{ state.pasta.maxComplementos = parseInt(e.target.value)||5; };

  // ready-made admin fields
  const rActive = $("r-active"); if(rActive) rActive.onchange = e=>{ state.ready.active = e.target.value==="true"; };
  const rDesc = $("r-desc"); if(rDesc) rDesc.onchange = e=>{ state.ready.desc = e.target.value; };
  $$("[data-r-extra-toggle]").forEach(el=> el.onclick = ()=>{
    const id = el.dataset.rExtraToggle;
    const idx = state.ready.extraIds.indexOf(id);
    if(idx>-1) state.ready.extraIds.splice(idx,1); else state.ready.extraIds.push(id);
    render();
  });
  $$("[data-r-field]").forEach(el=>{
    el.onchange = e=>{
      const idx = parseInt(el.dataset.idx);
      const field = el.dataset.rField;
      let val = e.target.value;
      if(field==="price") val = parseFloat(val)||0;
      if(field==="active") val = val==="true";
      state.ready.items[idx][field] = val;
    };
  });
  $$("[data-r-del-item]").forEach(el=> el.onclick = ()=>{ state.ready.items.splice(parseInt(el.dataset.rDelItem),1); render(); });
  const addReadyItemBtn = $("btn-add-ready-item");
  if(addReadyItemBtn) addReadyItemBtn.onclick = ()=>{ state.ready.items.push({id:"r-"+Date.now(), name:"Novo lanche", desc:"", price:0, active:true}); render(); };
  const saveReadyBtn = $("btn-save-ready");
  if(saveReadyBtn) saveReadyBtn.onclick = async ()=>{ state.savingReady=true; render(); await saveReady(state.ready); state.savingReady=false; render(); };

  $$("[data-b-field]").forEach(el=>{
    el.onchange = e=>{
      const objName = el.dataset.obj;
      const group = el.dataset.group;
      const i = parseInt(el.dataset.i);
      const field = el.dataset.bField;
      let val = e.target.value;
      if(field!=="name") val = parseFloat(val)||0;
      const target = objName==="pasta" ? state.pasta : state.builder;
      target[group][i][field] = val;
    };
  });
  $$("[data-b-del]").forEach(el=>{
    el.onclick = ()=>{
      const objName = el.dataset.obj;
      const group = el.dataset.bDel;
      const i = parseInt(el.dataset.i);
      const target = objName==="pasta" ? state.pasta : state.builder;
      target[group].splice(i,1);
      render();
    };
  });
  $$("[data-b-add]").forEach(el=>{
    el.onclick = ()=>{
      const objName = el.dataset.obj;
      const group = el.dataset.bAdd;
      const target = objName==="pasta" ? state.pasta : state.builder;
      const priceField = (group==="extras" || group==="complementos" || group==="finalizacao" || group==="molhos") ? "price" : "extra";
      const newId = group+"-"+Date.now();
      const obj = {id:newId, name:"Novo item"};
      obj[priceField] = (objName==="builder" && group==="cheeses") ? CHEESE_STANDARD_PRICE : 0;
      target[group].push(obj);
      render();
    };
  });

  const saveBuilderBtn = $("btn-save-builder");
  if(saveBuilderBtn) saveBuilderBtn.onclick = async ()=>{ state.savingBuilder=true; render(); await saveBuilder(state.builder); state.savingBuilder=false; render(); };
  const savePastaBtn = $("btn-save-pasta");
  if(savePastaBtn) savePastaBtn.onclick = async ()=>{ state.savingPasta=true; render(); await savePasta(state.pasta); state.savingPasta=false; render(); };

  const savePinBtn = $("btn-savepin");
  if(savePinBtn) savePinBtn.onclick = async ()=>{
    const val = $("inp-newpin").value.trim();
    if(val.length>=4){ await setPin(val); alert("PIN atualizado!"); } else alert("Use pelo menos 4 caracteres.");
  };
}

loadAll();
</script>
</body>
</html>
